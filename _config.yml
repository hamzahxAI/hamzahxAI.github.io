# ─────────────────────────────────────────────
#  Site Settings
# ─────────────────────────────────────────────
title: "Hamzah Pandith"
tagline: "Sales and Strategy · Solution Architecture · Data Scientist Data Scientist · ML Researcher · Open Source Contributor"
description: >-
  Personal site of Hamzah Pandith — machine learning engineer focused on NLP,
  deep learning, and production ML systems.

url: "https://hamzahxai.github.io"
baseurl: ""

# ─────────────────────────────────────────────
#  Theme — hacker (dark, techy, fast)
#  https://github.com/cotes2020/jekyll-theme-hacker
# ─────────────────────────────────────────────
theme: jekyll-theme-hacker

# Force dark mode by default (hacker feature)
# Options: light | dark
theme_mode: dark

# ─────────────────────────────────────────────
#  Author
# ─────────────────────────────────────────────
github:
  username: hamzahxai.github.io

twitter:
  username: hamzahxai       # optional — remove if unused

social:
  name: "Hamzah Pandith"
  email: "hpandith@outlook.com"
  links:
    - https://github.com/hamzahxai
    - https://linkedin.com/in/hpandith
  

# ─────────────────────────────────────────────
#  Avatar / Profile Photo
# ─────────────────────────────────────────────
avatar: "/assets/img/avatar.jpg"   # place your photo here

# ─────────────────────────────────────────────
#  Navigation (hacker sidebar)
# ─────────────────────────────────────────────
# hacker auto-generates nav from your _tabs/ pages.
# Create these files: _tabs/about.md, _tabs/projects.md, _tabs/blog.md

# ─────────────────────────────────────────────
#  Analytics (optional)
# ─────────────────────────────────────────────
google_analytics:
  id: "G-XXXXXXXXXX"              # paste your GA4 ID here

# ─────────────────────────────────────────────
#  Comments (optional — utterances uses GitHub Issues)
# ─────────────────────────────────────────────
comments:
  active: utterances
  utterances:
    repo: "yourusername/yourusername.github.io"
    issue_term: pathname

# ─────────────────────────────────────────────
#  SEO / Open Graph
# ─────────────────────────────────────────────
twitter_card: summary_large_image

# ─────────────────────────────────────────────
#  Build Settings
# ─────────────────────────────────────────────
timezone: "Europe/Dublin"          # your timezone
lang: "en"

markdown: kramdown
highlighter: rouge                 # syntax highlighting for code blocks

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true           # show line numbers in code blocks

# ─────────────────────────────────────────────
#  Pagination
# ─────────────────────────────────────────────
paginate: 10
paginate_path: "/blog/page:num/"

# ─────────────────────────────────────────────
#  Plugins
# ─────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# ─────────────────────────────────────────────
#  Exclude from build
# ─────────────────────────────────────────────
exclude:
  - "*.gem"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "node_modules"
  - "vendor"
